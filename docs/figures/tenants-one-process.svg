<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="t-tenants-one-process d-tenants-one-process">
<title id="t-tenants-one-process">A VM per tenant versus one Egres process with thousands of tenants</title>
<desc id="d-tenants-one-process">Left: three virtual machines, each with its own kernel and database process, one tenant each. Right: one Egres process on eight threads holding thousands of tenants as fibers, with CPU, memory and disk I/O metered per tenant.</desc>

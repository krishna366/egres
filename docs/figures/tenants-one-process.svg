<text x="48" y="318" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#98A2B3" text-anchor="start" >tenant pays for a kernel, a memory floor and a</text>

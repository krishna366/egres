<text x="48" y="272" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#98A2B3" text-anchor="start" >The database cannot tell tenants apart, so</text>

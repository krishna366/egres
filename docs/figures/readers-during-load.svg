<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="t-readers-during-load d-readers-during-load">
<title id="t-readers-during-load">Reader transactions per second, in 5-minute averages, through the 600M-row load and the 30-minute settle after it, Postgres and Egres, on a log scale</title>
<desc id="d-readers-during-load">Postgres starts near 66,246 a second, falls below 100 by the end of its load at 98 minutes and stays there through the settle, ending at 99. Egres starts near 23,661, declines to about 2,000 by the end of its load at 113 minutes and climbs to 3,739 by the end of its settle.</desc>

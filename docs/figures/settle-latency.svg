<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" role="img" aria-labelledby="t-settle-latency d-settle-latency">
<title id="t-settle-latency">Query latency in the 30-minute settle after the 600M-row load, Postgres and Egres, p50, p95 and p99 for each of the four reader queries, in milliseconds on a log scale</title>
<desc id="d-settle-latency">Egres has the lower median on all four queries. On the two-column queries Egres is faster at every percentile: sku_day 2.04, 3.9 and 5.3 ms against 461, 490 and 748 in Postgres; customer_day_count 0.99, 2.0 and 3.7 against 12.0, 15.1 and 17.2. Postgres keeps the better p95 on select, 0.72 against 0.79, and the better p95 and p99 on customer, 14.1 and 16.1 against 20.4 and 24.3.</desc>

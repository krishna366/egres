global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  # Host CPU, memory, disks, filesystems, plus the textfile collector
  # that the load driver and the pgbench parser write into.
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  # Per-process CPU, RSS and thread counts: egres, pgbench, psql.
  - job_name: process
    static_configs:
      - targets: ["127.0.0.1:9256"]

  # Postgres (the P1 run): pg_stat_database, sizes, bgwriter.
  - job_name: postgres
    static_configs:
      - targets: ["127.0.0.1:9187"]

  # Egres's own counters (the admin `zdb` command) plus data dir sizes.
  - job_name: egres
    scrape_timeout: 8s
    static_configs:
      - targets: ["127.0.0.1:9877"]

# A run with load on each OS, twice a day and by hand: the orders
# benchmark cut to a runner's size through scripts/soak.sh (about 20
# minutes of load, readers, settle and a pgbench workload, then a clean
# stop), in a ReleaseSafe build. The harness's own run dir, summaries
# and server log included, is the job's artifact either way.
name: soak

on:
  schedule:
    # Noon and 6 pm PST; an hour later on the clock during PDT.
    - cron: '0 20 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest: 4 cores, 16 GB. macos-15: 3 cores, 7 GB.
          # The data dir's cap comes from the free space the script
          # finds, so a runner with less disk loads less rather than
          # filling up.
          - os: ubuntu-latest
            cache: 2GiB
            streams: 4
          - os: macos-15
            cache: 1GiB
            streams: 2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The same key as ci.yml, so the allocator archive is a cache hit.
      - uses: actions/cache@v6
        with:
          path: .deps
          key: >-
            deps-${{ runner.os }}-${{
            hashFiles('build.zig', 'scripts/bootstrap-*.sh') }}

      # The harness is Python 3.11+ (tomllib).
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # psql drives the load, pgbench the readers and the workload. The
      # Ubuntu image ships PostgreSQL under /usr/lib/postgresql; the Mac
      # gets libpq from brew, or the full server if that lacks pgbench.
      - name: Find psql and pgbench
        id: pg
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            bin=$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null \
              | sort -V | tail -n 1)
            if [ ! -x "$bin/pgbench" ]; then
              sudo apt-get update -q
              sudo apt-get install -y -q postgresql-16
              sudo systemctl stop postgresql || true
              bin=/usr/lib/postgresql/16/bin
            fi
          else
            brew install -q libpq
            bin=$(brew --prefix libpq)/bin
            if [ ! -x "$bin/pgbench" ]; then
              brew install -q postgresql@16
              bin=$(brew --prefix postgresql@16)/bin
            fi
          fi
          "$bin/pgbench" --version
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      - name: Build (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      # The Ubuntu image has one 72 GB disk with about 12 GB free (no
      # separate /mnt). Its preinstalled toolchains are 20-30 GB that
      # this job never uses; the data cap below is sized from what is
      # free, so every GB reclaimed is load time.
      - name: Free the runner's disk (Linux)
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /usr/lib/jvm
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - name: Point the harness at this runner
        run: |
          root=$RUNNER_TEMP/soak
          mkdir -p "$root/out" "$root/data" "$root/wal"
          echo "SOAK_ROOT=$root" >> "$GITHUB_ENV"
          df -h "$root"
          cat > benchmarks/run/local.toml <<EOF
          out_root = "$root/out"
          data_root = "$root/data"
          wal_root = "$root/wal"
          pgbin = "${{ steps.pg.outputs.bin }}"
          EOF

      - name: Soak
        env:
          SOAK_CACHE: ${{ matrix.cache }}
          SOAK_STREAMS: ${{ matrix.streams }}
        run: scripts/soak.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-${{ matrix.os }}
          path: ${{ env.SOAK_ROOT }}/out
          if-no-files-found: ignore

# Build the release tarball for a version tag and publish it as a GitHub
# release. scripts/install.sh downloads exactly these names:
#
#   egres-<tag>-linux-x86_64.tar.gz   (egres and LICENSE at the top level)
#   SHA256SUMS                        (sha256sum format, bare file names)
#
# The binary targets glibc 2.28 (2018), so it runs on any mainstream
# distro since then rather than only on the runner's own glibc. jemalloc
# is configured through `zig cc` with the same target so its feature
# probes see that glibc and not the runner's.
#
# A tag with a suffix (v0.1.0-rc.1) becomes a pre-release, which GitHub's
# "latest" and therefore the installer's default skip; the installer
# reaches it with EGRES_VERSION=v0.1.0-rc.1.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  ZIG_TARGET: x86_64-linux-gnu.2.28
  GLIBC_FLOOR: '2.28'

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Not the ci.yml cache: that jemalloc was built for the runner's
      # glibc. This key carries the target.
      - uses: actions/cache@v6
        with:
          path: .deps
          key: >-
            deps-release-${{ env.ZIG_TARGET }}-${{
            hashFiles('build.zig', 'scripts/bootstrap-*.sh') }}

      - name: Build
        env:
          CC: zig cc -target ${{ env.ZIG_TARGET }}
        run: zig build -Drelease -Dtarget=${{ env.ZIG_TARGET }}

      # The floor is only real if nothing pulled in a newer symbol.
      - name: Check the glibc floor and that the binary runs
        run: |
          newest=$(objdump -T zig-out/bin/egres | grep -o 'GLIBC_[0-9.]*' \
            | sed 's/GLIBC_//' | sort -uV | tail -n 1)
          echo "newest glibc symbol version: $newest (floor $GLIBC_FLOOR)"
          highest=$(printf '%s\n%s\n' "$newest" "$GLIBC_FLOOR" \
            | sort -V | tail -n 1)
          if [ "$highest" != "$GLIBC_FLOOR" ]; then
            echo "::error::needs glibc $newest, above the $GLIBC_FLOOR floor"
            exit 1
          fi
          zig-out/bin/egres --help > /dev/null

      - name: Pack
        run: |
          tag=${GITHUB_REF_NAME}
          name="egres-${tag}-linux-x86_64"
          mkdir -p stage dist
          cp zig-out/bin/egres LICENSE stage/
          tar -C stage -czf "dist/${name}.tar.gz" egres LICENSE
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          ls -l dist
          cat dist/SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF_NAME}
          case "$tag" in
            *-*) pre=--prerelease ;;
            *) pre= ;;
          esac
          notes="Install: \`curl -fsSL https://egresql.io/install.sh | sh\`"
          notes="$notes (pin with \`EGRES_VERSION=$tag\`)."
          gh release create "$tag" --verify-tag --title "$tag" $pre \
            --notes "$notes" dist/*.tar.gz dist/SHA256SUMS
